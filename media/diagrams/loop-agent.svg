<text x="340" y="308" text-anchor="middle" class="bs">smoothing, damp, cap</text>

<path class="aw" d="M300 326 C300 348 232 344 218 360" marker-end="url(#ar)"/>
<path class="aw" d="M380 326 C380 348 448 344 462 360" marker-end="url(#ar)"/>

