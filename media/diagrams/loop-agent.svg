<text x="340" y="209" text-anchor="middle" style="font-family:Georgia,serif;font-size:9.4px;fill:#c9e2da">action, jumlah, alasan</text>
<text x="340" y="223" text-anchor="middle" style="font-family:Georgia,serif;font-size:9.4px;fill:#c9e2da">satu baris per SKU</text>

<path class="aw" d="M340 234 L340 268" marker-end="url(#ar)"/>

