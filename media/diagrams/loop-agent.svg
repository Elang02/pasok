<path class="dash" d="M430 201 C480 201 490 300 518 306"/>
<path class="dash" d="M570 354 L570 360"/>

<path class="dash" d="M110 389 C52 389 46 240 46 130 C46 90 96 72 148 72" marker-end="url(#ar2)"/>
